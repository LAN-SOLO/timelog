[package]
name = "timelog-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "timelog core: time-tracking domain — durations, rounding, week logic, aggregation, CSV, JSON merge"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
